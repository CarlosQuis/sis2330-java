name: testing-hs
version: 0.1.0.0
license: BSD-3-Clause

dependencies:
  - base >= 4.7 && < 5

library:
  source-dirs: src
  exposed-modules:
    - Notas
    - Historial
  dependencies:
    - containers
    - mtl

executables:
  testing-hs-exe:
    main: Main.hs
    source-dirs: app
    dependencies:
      - testing-hs
      - containers
      - mtl

tests:
  testing-hs-test:
    main: Spec.hs
    source-dirs: test
    dependencies:
      - testing-hs
      - HUnit
      - QuickCheck